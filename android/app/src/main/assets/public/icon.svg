<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="satGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#24304d" stroke-width="6"/>

  <!-- Satellite Dish Graphic -->
  <g transform="translate(256, 256)">
    <!-- Signal Wave Rings -->
    <path d="M -160,-80 A 180,180 0 0,1 160,-80" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
    <path d="M -110,-40 A 120,120 0 0,1 110,-40" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M -60,0 A 60,60 0 0,1 60,0" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round"/>

    <!-- Parabolic Dish Body -->
    <path d="M -130,40 Q 0,160 130,40" fill="none" stroke="url(#satGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- LNB Arm and Horn -->
    <line x1="0" y1="120" x2="0" y2="20" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="15" r="18" fill="#eab308" stroke="#f8fafc" stroke-width="6"/>

    <!-- Dish Mount Stand -->
    <path d="M -40,140 L 0,180 L 40,140" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="180" x2="0" y2="210" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Accent Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
</svg>
